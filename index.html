<!DOCTYPE html>

<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Frontend Core Mastery</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="brand">
            Frontend Core
        </div>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Orders</a>
            <a href="#">Customers</a>
        </nav>

        <div class="nav-actions">
            <button type="button">
                Notifications
            </button>

            <button type="button">
                Profile
            </button>
        </div>

    </header>


    <main class="page-container">

        <section class="products-section">

            <div class="section-header">

                <div>
                    <h1>Products</h1>

                    <p>
                        Manage products from this page.
                    </p>
                </div>

                <button type="button">
                    Add Product
                </button>

            </div>


            <form class="product-form">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="productName">
                            Product Name
                        </label>

                        <input
                            id="productName"
                            name="productName"
                            class="form-control"
                            type="text"
                            required
                            minlength="2"
                            maxlength="100">

                    </div>


                    <div class="form-group">

                        <label for="price">
                            Price
                        </label>

                        <input
                            id="price"
                            name="price"
                            class="form-control"
                            type="number"
                            required
                            min="0"
                            step="0.01">

                    </div>


                    <div class="form-group">

                        <label for="quantity">
                            Quantity
                        </label>

                        <input
                            id="quantity"
                            name="quantity"
                            class="form-control"
                            type="number"
                            required
                            min="1">

                    </div>

                </div>


                <div class="form-actions">

                    <button type="submit">
                        Add Product
                    </button>

                    <button type="reset">
                        Reset
                    </button>

                </div>

            </form>


            <div class="table-section">

                <div class="table-header">

                    <h2>
                        Product List
                    </h2>

                    <div class="table-tools">

                        <input
                            type="search"
                            placeholder="Search products">

                        <select>
                            <option>
                                All Products
                            </option>

                            <option>
                                In Stock
                            </option>

                            <option>
                                Out of Stock
                            </option>
                        </select>

                    </div>

                </div>


                <div class="table-wrapper">

                    <table>

                        <thead>

                            <tr>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody id="productTable">

                            <tr data-product-id="1">

                                <td>
                                    iPhone
                                </td>

                                <td>
                                    $1000
                                </td>

                                <td>
                                    2
                                </td>

                                <td>

                                    <div class="row-actions">

                                        <button
                                            type="button"
                                            class="edit-button"
                                            data-product-id="1">
                                            Edit
                                        </button>

                                        <button
                                            type="button"
                                            class="delete-button"
                                            data-product-id="1">
                                            Delete
                                        </button>

                                    </div>

                                </td>

                            </tr>


                            <tr data-product-id="2">

                                <td>
                                    MacBook
                                </td>

                                <td>
                                    $2000
                                </td>

                                <td>
                                    1
                                </td>

                                <td>

                                    <div class="row-actions">

                                        <button
                                            type="button"
                                            class="edit-button"
                                            data-product-id="2">
                                            Edit
                                        </button>

                                        <button
                                            type="button"
                                            class="delete-button"
                                            data-product-id="2">
                                            Delete
                                        </button>

                                    </div>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>


    <footer class="footer">

        <p>
            Frontend Core Mastery
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
