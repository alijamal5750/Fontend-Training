<!DOCTYPE html>

<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Frontend Core Mastery</title>

   
</head>

<body>

    <header>
    
        <div class="brand">
            Frontend Core
        </div>
       
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Orders</a>
            <a href="#">Customers</a>
        </nav>

        <div class="user-actions">
            <button type="button">
                Login
            </button>

            <button type="button">
                Signup
            </button>
        </div>
   </header>

   <main>
    
    <div class="page-header">
        <div class="first-row">
            <h1>Products</h1>
           
                <button class="button-add-product">
                    Add New Product
                </button>
        </div>
        <p>all info are here</p>
    </div>

    <div class="form-container">
    <div class="first-row-form">
    <div class="form-group">
        <label for="productname">
            Product Name
        </label>
        <input type="text"
         id="productname"
         name="productname"
         class="form-control"
         />
    </div>
    <div class="form-group">
        <label for="productprice">
            Price
        </label>
        <input type="number"
         id="productprice"
         name="productprice"
         class="form-control"
         />
    </div>
     <div class="form-group">
        <label for="productQuantity">
            Quantity
        </label>
        <input type="number"
         id="productQuantity"
         name="productQuantity"
         class="form-control"
         />
    </div>
    </div>

    <div class="second-row-form">
        <button>Add Product</button>
        <button>Reset</button>
    </div>

    </div>

    <div class="table-info">
        
            
        <div class="table-info-header">
            <h1>Product List</h1>
            
            <div class="table-tools">
<input placeholder="Search products" />
            <select>
                <option>All Products</option>
                <option>Laptop</option>
                <option>Iphone</option>
            </select>
            </div>
            
        </div>

        <div class="table">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productTable">
                    <tr data-product-id="1">
                        <td>Iphone</td>
                        <td>$1000</td>
                        <td>Quantity</td>
                       <div class="td-action">
                            <td>
                        <button data-product-id="1">Edit</button>
                        <button data-product-id="1">Delete</button>
                        </td>
                        </div>
                    </tr>
                    <tr data-product-id="2">
                        <td>Iphone</td>
                        <td>$1000</td>
                        <td>Quantity</td>
                        <div class="td-action">
                            <td>
                        <button data-product-id="2">Edit</button>
                        <button data-product-id="2">Delete</button>
                        </td>
                        </div>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

   </main>
   


    <footer class="footer">

        <p>Course Training</p>

    </footer>

</body>

</html>

     max-width: 1200px;

 padding: 0.875rem;

text-align: center;
