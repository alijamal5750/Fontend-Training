<!DOCTYPE html>

<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Frontend Core Mastery
    </title>

</head>


<body>


<header>

    <div class="brand">
        Frontend Core
    </div>


    <nav class="nav-links">

        <a href="#">
            Home
        </a>

        <a href="#">
            Products
        </a>

        <a href="#">
            Orders
        </a>

        <a href="#">
            Customers
        </a>

    </nav>


    <div class="user-actions">

        <button type="button">
            Login
        </button>

        <button type="button">
            Signup
        </button>

    </div>

</header>



<main>


    <div class="page-header">


        <div class="first-row">

            <h1>
                Products
            </h1>

            <button
                type="button"
                class="button-add-product">

                Add New Product

            </button>

        </div>


        <p>
            all info are here
        </p>


    </div>



    <div class="form-container">


        <form>


            <div class="first-row-form">


                <div class="form-group">

                    <label for="productname">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productname"
                        name="productname"
                        class="form-control">

                </div>


                <div class="form-group">

                    <label for="productprice">
                        Price
                    </label>

                    <input
                        type="number"
                        id="productprice"
                        name="productprice"
                        class="form-control">

                </div>


                <div class="form-group">

                    <label for="productQuantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="productQuantity"
                        name="productQuantity"
                        class="form-control">

                </div>


            </div>



            <div class="second-row-form">

                <button type="submit">
                    Add Product
                </button>

                <button type="reset">
                    Reset
                </button>

            </div>


        </form>


    </div>



    <div class="table-info">


        <div class="table-info-header">


            <h1>
                Product List
            </h1>


            <div class="table-tools">


                <input
                    type="search"
                    placeholder="Search products">


                <select>

                    <option>
                        All Products
                    </option>

                    <option>
                        Laptop
                    </option>

                    <option>
                        Iphone
                    </option>

                </select>


            </div>


        </div>



        <div class="table">


            <table>


                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            Price
                        </th>

                        <th>
                            Quantity
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="productTable">


                    <tr data-product-id="1">


                        <td>
                            Iphone
                        </td>


                        <td>
                            $1000
                        </td>


                        <td>
                            10
                        </td>


                        <td>

                            <div class="td-actions">

                                <button
                                    type="button"
                                    data-product-id="1">
                                    Edit
                                </button>

                                <button
                                    type="button"
                                    data-product-id="1">
                                    Delete
                                </button>

                            </div>

                        </td>


                    </tr>



                    <tr data-product-id="2">


                        <td>
                            Laptop
                        </td>


                        <td>
                            $500
                        </td>


                        <td>
                            2
                        </td>


                        <td>

                            <div class="td-actions">

                                <button
                                    type="button"
                                    data-product-id="2">
                                    Edit
                                </button>

                                <button
                                    type="button"
                                    data-product-id="2">
                                    Delete
                                </button>

                            </div>

                        </td>


                    </tr>


                </tbody>


            </table>


        </div>


    </div>


</main>



<footer>

    <p>
        Course Training
    </p>

</footer>


</body>

</html>


<style>
   /* =========================================
   Base
========================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
}


body {
    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    line-height: 1.5;

    background-color: #f5f6f8;

    color: #222;
}


button,
input,
select {
    font: inherit;
}


button {
    cursor: pointer;
}


a {
    color: inherit;

    text-decoration: none;
}



/* =========================================
   Header
========================================= */

header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 2rem;

    padding: 1rem;

    background-color: white;

    border-bottom:
        1px solid #ddd;
}


.brand {
    flex-shrink: 0;

    font-weight: 700;
}


.nav-links {
    display: flex;

    gap: 1rem;

    flex-wrap: wrap;
}


.user-actions {
    display: flex;

    gap: 0.5rem;
}



/* =========================================
   Main
========================================= */

main {
    width: 100%;

    max-width: 1200px;

    margin-inline: auto;

    padding: 2rem;
}



/* =========================================
   Page Header
========================================= */

.page-header {
    display: flex;

    flex-direction: column;
}


.first-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 1rem;
}


.first-row h1 {
    font-size: 1.5rem;
}


.page-header p {
    margin: 0;
}



/* =========================================
   Form
========================================= */

.form-container {
    display: flex;

    flex-direction: column;

    gap: 1rem;

    padding: 1rem;

    border:
        0.5px solid rgb(158, 152, 152);

    border-radius:
        5px;

    background-color:
        white;
}


.first-row-form {
    display: flex;

    flex-direction: row;

    gap: 1rem;
}


.form-group {
    flex: 1;
}


.form-group label {
    display: block;

    margin-block-end:
        0.5rem;
}


.form-control {
    width: 100%;

    padding: 1rem;

    border:
        0.5px solid rgb(158, 152, 152);

    border-radius:
        10px;
}


.second-row-form {
    display: flex;

    flex-direction: row;

    gap: 1rem;

    margin-block-start:
        0.5rem;
}



/* =========================================
   Table Container
========================================= */

.table-info {
    display: flex;

    flex-direction: column;

    gap: 1rem;

    margin-block-start:
        1rem;

    border:
        0.5px solid rgb(158, 152, 152);

    border-radius:
        5px;

    background-color:
        white;
}



/* =========================================
   Table Header / Tools
========================================= */

.table-info-header {
    display: flex;

    flex-direction: row;

    align-items: center;

    justify-content: space-between;

    gap: 1rem;

    padding: 1rem;
}


.table-info-header h1 {
    margin: 0;
}


.table-tools {
    display: flex;

    flex-direction: row;

    gap: 1rem;
}


.table-tools input,
.table-tools select {
    width: 100%;

    padding:
        0.75rem 1rem;

    border:
        0.5px solid rgb(158, 152, 152);

    border-radius:
        10px;
}



/* =========================================
   Table
========================================= */

.table {
    width: 100%;

    overflow-x: auto;
}


table {
    width: 100%;

    min-width: 700px;

    border-collapse: collapse;
}


th,
td {
    padding:
        0.875rem;

    text-align:
        start;

    border-bottom:
        1px solid #ddd;
}


.td-actions {
    display: flex;

    align-items: center;

    gap: 0.5rem;
}



/* =========================================
   Footer
========================================= */

footer {
    text-align: center;
}



/* =========================================
   Tablet
========================================= */

@media (max-width: 900px) {


    header {
        flex-wrap: wrap;
    }


    .nav-links {
        width: 100%;

        justify-content: center;
    }


    .table-info-header {
        flex-direction: column;

        align-items: stretch;
    }


    .table-tools {
        width: 100%;
    }


    .table-tools input {
        flex: 1;
    }


}



/* =========================================
   Mobile
========================================= */

@media (max-width: 640px) {


    header {
        flex-direction: column;

        align-items: stretch;

        gap: 1rem;
    }


    .nav-links {
        width: 100%;

        justify-content: flex-start;
    }


    .user-actions {
        width: 100%;
    }


    .user-actions button {
        flex: 1;
    }


    main {
        padding: 1rem;
    }


    .first-row {
        flex-direction: column;

        align-items: stretch;

        gap: 0.75rem;
    }


    .button-add-product {
        width: 100%;
    }


    .first-row-form {
        flex-direction: column;
    }


    .second-row-form button {
        flex: 1;
    }


    .table-tools {
        flex-direction: column;
    }


    .table-tools input,
    .table-tools select {
        width: 100%;
    }


}

</style>
